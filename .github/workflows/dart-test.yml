name: Run unit tests

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Extract folder name from branch
        id: extract_folder
        run: |
          echo "::group::Extracting version folder from branch name"
          echo "🔍 Branch name: ${{ github.head_ref }}"
          
          # Extract just the version part (v## only)
          folder_name=$(echo "${{ github.head_ref }}" | grep -o '^v[0-9][0-9]' | head -n 1)
          
          if [ -z "$folder_name" ]; then
            echo "❌ No version folder found in branch name"
            echo "Expected pattern: v[0-9][0-9] at the start of branch name"
            echo "Examples: v01_feature, v04_add_delete_function, v23_bugfix"
            echo "Branch: ${{ github.head_ref }}"
          else
            echo "✅ Extracted version folder: $folder_name"
            
            # Verify the folder actually exists
            if [ ! -d "$folder_name" ]; then
              echo "❌ Folder '$folder_name' does not exist in repository"
              echo "📁 Available version folders:"
              ls -d v[0-9][0-9] 2>/dev/null || echo "No version folders found"
              folder_name=""
            else
              echo "✅ Folder '$folder_name' exists and will be tested"
              echo "📁 Contents of $folder_name:"
              ls -la "$folder_name" | head -5
            fi
          fi
          
          echo "folder_name=$folder_name" >> $GITHUB_OUTPUT
          echo "::endgroup::"

      - name: 🎯 Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        if: steps.extract_folder.outputs.folder_name != ''
        with:
          sdk: '3.9.4'

      - name: 📦 Install dependencies
        if: steps.extract_folder.outputs.folder_name != ''
        working-directory: ${{ steps.extract_folder.outputs.folder_name }}
        run: |
          echo "::group::Installing Dart dependencies"
          echo "📂 Working directory: ${{ steps.extract_folder.outputs.folder_name }}"
          echo "📄 Checking pubspec.yaml:"
          cat pubspec.yaml | head -10
          dart pub get
          echo "::endgroup::"

      - name: 🧪 Run tests
        if: steps.extract_folder.outputs.folder_name != ''
        working-directory: ${{ steps.extract_folder.outputs.folder_name }}
        run: |
          echo "::group::Running Dart tests"
          echo "📂 Working directory: ${{ steps.extract_folder.outputs.folder_name }}"
          echo "🔍 Looking for test files:"
          find . -name "*_test.dart" -type f || echo "No test files found"
          echo "📁 Test directory contents:"
          ls -la test/ 2>/dev/null || echo "No test directory found"
          
          # Run tests with verbose output
          dart test --reporter=expanded
          echo "::endgroup::"

      - name: ⏭️ Skip notification
        if: steps.extract_folder.outputs.folder_name == ''
        run: |
          echo "::warning::Tests skipped - no version folder found in branch name"
          echo "💡 Branch names should contain a version pattern like:"
          echo "  - v01, v02, v23 (basic version)"
          echo "  - v04_final, v05_beta, v10_release (version with suffix)"
          echo "  - v04_final_work, v05_beta_test (version with multiple suffixes)"
