name: Dart Multi-Project

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug project discovery
        run: |
          echo "🔍 Repository structure:"
          find . -name "pubspec.yaml" -not -path "./.dart_tool/*" | head -20
          
          echo ""
          echo "🔍 Directory listing:"
          ls -la
          
          echo ""
          echo "🔍 Project directories:"
          find . -maxdepth 1 -type d -name "v*" | sort
  test:
    needs: changes
    if: needs.changes.outputs.projects != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: ${{ fromJson(needs.changes.outputs.projects) }}
      fail-fast: false

    container:
      image: dart:stable

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test ${{ matrix.project }}
        working-directory: ${{ matrix.project }}
        run: |
          echo "🔍 Testing project: ${{ matrix.project }}"
          dart --version
          
          echo "📦 Installing dependencies..."
          dart pub get
          
          echo "🎨 Checking formatting..."
          dart format --output=none --set-exit-if-changed .
          
          echo "🔍 Analyzing code..."
          dart analyze --fatal-infos
          
          echo "🧪 Running tests..."
          dart test
          
          echo "✅ ${{ matrix.project }} completed successfully"